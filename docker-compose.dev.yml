services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fenjalbum
      POSTGRES_USER: fenjalbum
      POSTGRES_PASSWORD: fenjalbum
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fenjalbum_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fenjalbum -d fenjalbum"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fenjalbum_db:
