services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fenjalbum
      POSTGRES_USER: fenjalbum
      POSTGRES_PASSWORD: fenjalbum
    ports:
      - "5432:5432"
    volumes:
      - fenjalbum_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fenjalbum -d fenjalbum"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://fenjalbum:fenjalbum@db:5432/fenjalbum?schema=public}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      MEDIA_ROOT: /data/media
      THUMB_ROOT: /data/thumbs
      POSTER_ROOT: /data/posters
      UPLOAD_TMP_ROOT: /data/tmp
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      RATE_LIMIT_UPLOAD_MAX: ${RATE_LIMIT_UPLOAD_MAX:-20}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - fenjalbum_media:/data/media
      - fenjalbum_thumbs:/data/thumbs
      - fenjalbum_posters:/data/posters
      - fenjalbum_tmp:/data/tmp
    command: sh -lc "npx prisma migrate deploy && npm run start"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://fenjalbum:fenjalbum@db:5432/fenjalbum?schema=public}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      MEDIA_ROOT: /data/media
      THUMB_ROOT: /data/thumbs
      POSTER_ROOT: /data/posters
      UPLOAD_TMP_ROOT: /data/tmp
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - fenjalbum_media:/data/media
      - fenjalbum_thumbs:/data/thumbs
      - fenjalbum_posters:/data/posters
      - fenjalbum_tmp:/data/tmp
    command: sh -lc "npx prisma migrate deploy && npm run worker"

volumes:
  fenjalbum_db:
  fenjalbum_media:
  fenjalbum_thumbs:
  fenjalbum_posters:
  fenjalbum_tmp:
