services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    volumes:
      - fenjalbum_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fenjalbum -d fenjalbum"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: fenjalbum-app
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ${APP_ENV_FILE:-.env.production}
    ports:
      - "${FENJALBUM_BIND_ADDRESS:-127.0.0.1}:${FENJALBUM_PORT:-3300}:3000"
    volumes:
      - ${FENJALBUM_STORAGE_ROOT:-./storage}/media:/data/media
      - ${FENJALBUM_STORAGE_ROOT:-./storage}/thumbs:/data/thumbs
      - ${FENJALBUM_STORAGE_ROOT:-./storage}/posters:/data/posters
      - ${FENJALBUM_STORAGE_ROOT:-./storage}/tmp:/data/tmp
      - ${FENJALBUM_IMPORT_ROOT:-./import}:/import:ro
    command: sh -lc "npx prisma migrate deploy && npm run start"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: .
    image: fenjalbum-app
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file: ${APP_ENV_FILE:-.env.production}
    volumes:
      - ${FENJALBUM_STORAGE_ROOT:-./storage}/media:/data/media
      - ${FENJALBUM_STORAGE_ROOT:-./storage}/thumbs:/data/thumbs
      - ${FENJALBUM_STORAGE_ROOT:-./storage}/posters:/data/posters
      - ${FENJALBUM_STORAGE_ROOT:-./storage}/tmp:/data/tmp
    command: sh -lc "npx prisma migrate deploy && npm run worker"

volumes:
  fenjalbum_db:
